
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro | Rushball</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101827, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        .error-card {
            max-width: 550px;
            width: 90%;
            padding: 50px 35px;
            border-radius: 18px;
            background: #ffffff;
            color: #212529;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .error-icon {
            font-size: 65px;
            color: #dc3545;
        }

        .error-code {
            font-size: 65px;
            font-weight: bold;
            color: #dc3545;
        }

        .error-message {
            color: #6c757d;
            font-size: 16px;
            margin-top: 15px;
        }

        .btn-home {
            background-color: #198754;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-home:hover {
            background-color: #146c43;
            color: white;
            transform: translateY(-2px);
        }

        .brand {
            font-weight: bold;
            color: #198754;
            font-size: 22px;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <main class="error-card">

        <div class="brand">
            <i class="bi bi-trophy-fill"></i>
            RUSHBALL
        </div>

        <div class="error-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <div class="error-code">
            Ops!
        </div>

        <h2 class="fw-bold">Algo deu errado.</h2>

        <p class="error-message"
           th:text="${erro != null ? erro : 'Não foi possível processar sua solicitação. Tente novamente.'}">
        </p>

        <a th:href="@{/}" class="btn-home">
            <i class="bi bi-house-fill"></i>
            Voltar para o início
        </a>

    </main>

</body>
</html>
