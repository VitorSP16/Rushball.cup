
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Rushball.cup</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #06152b;
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            padding: 22px 7%;
            background: #041124;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #ffc928;
        }

        .voltar {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .voltar:hover {
            color: #ffc928;
        }

        /* LOGIN */

        .login-section {
            min-height: 85vh;
            display: flex;
            align-items: center;
            padding: 50px 0;
            background:
                radial-gradient(circle at 80% 50%, #174a7b 0%, transparent 40%),
                linear-gradient(120deg, #06152b, #0b2b50);
        }

        .login-container {
            background: rgba(5, 23, 46, 0.85);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        /* FORMULÁRIO */

        .login-form {
            padding: 55px 45px;
        }

        .tag {
            color: #ffc928;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .login-form h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .login-form h1 span {
            color: #ffc928;
        }

        .descricao {
            color: #aab8c9;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .form-label {
            color: white;
            font-size: 13px;
            font-weight: 600;
        }

        .form-control {
            background: #102b4b;
            border: 1px solid #294361;
            color: white;
            padding: 13px;
            border-radius: 5px;
        }

        .form-control:focus {
            background: #102b4b;
            color: white;
            border-color: #ffc928;
            box-shadow: 0 0 0 0.2rem rgba(255,201,40,0.15);
        }

        .form-control::placeholder {
            color: #8192a8;
        }

        .esqueceu {
            color: #ffc928;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        .esqueceu:hover {
            color: white;
        }

        .btn-entrar {
            width: 100%;
            background: #ffc928;
            color: #06152b;
            border: none;
            padding: 14px;
            border-radius: 5px;
            font-weight: 900;
            margin-top: 25px;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            background: white;
            transform: translateY(-2px);
        }

        .cadastro {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #aab8c9;
        }

        .cadastro a {
            color: #ffc928;
            text-decoration: none;
            font-weight: 800;
        }

        /* IMAGEM */

        .login-image {
            position: relative;
            min-height: 570px;
            height: 100%;
            background:
                linear-gradient(rgba(3,15,32,0.35), rgba(3,15,32,0.75)),
                url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1200&q=85');

            background-size: cover;
            background-position: center;
            display: flex;
            align-items: end;
            padding: 40px;
        }

        .image-text {
            position: relative;
            z-index: 2;
        }

        .image-text h2 {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.1;
        }

        .image-text h2 span {
            color: #ffc928;
        }

        .image-text p {
            color: #d2dce8;
            font-size: 13px;
            margin-top: 15px;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 768px) {

            .login-form {
                padding: 40px 25px;
            }

            .login-image {
                display: none;
            }

            .login-form h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

    <!-- MENU -->
    <nav class="navbar">

        <div class="container-fluid">

            <a href="index.html" class="logo">
                RUSHBALL<span>.cup</span>
            </a>

            <a href="index.html" class="voltar">
                ← Voltar ao início
            </a>

        </div>

    </nav>


    <!-- LOGIN -->
    <section class="login-section">

        <div class="container">

            <div class="login-container">

                <div class="row g-0">

                    <!-- FORMULÁRIO -->
                    <div class="col-lg-6">

                        <div class="login-form">

                            <div class="tag">
                                ● BEM-VINDO DE VOLTA
                            </div>

                            <h1>
                                FAÇA SEU <span>LOGIN.</span>
                            </h1>

                            <p class="descricao">
                                Entre na sua conta e acompanhe tudo sobre a Copa.
                            </p>

                            <form action="#" method="POST">

                                <div class="mb-4">

                                    <label class="form-label">
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        placeholder="Digite seu e-mail"
                                        required
                                    >

                                </div>


                                <div class="mb-3">

                                    <label class="form-label">
                                        Senha
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="Digite sua senha"
                                        required
                                    >

                                </div>


                                


                                <button type="submit" class="btn-entrar">
                                    ENTRAR →
                                </button>

                            </form>


                            <div class="cadastro">

                                Ainda não tem uma conta?

                                <a href="cadastro.html">
                                    Cadastre-se
                                </a>

                            </div>

                        </div>

                    </div>


                    <!-- IMAGEM -->
                    <div class="col-lg-6">

                        <div class="login-image">

                            <div class="image-text">

                                <h2>
                                    A PAIXÃO PELO FUTEBOL.
                                    <br>
                                    <span>EM UM SÓ LUGAR.</span>
                                </h2>

                                <p>
                                    Notícias, jogos e suas seleções favoritas.
                                    Tudo isso espera por você.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
