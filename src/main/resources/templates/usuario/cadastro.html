
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Rushball.cup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">

    

</head>

<body>

    <!-- MENU -->

    <nav class="navbar">

        <div class="container-fluid">

            <a th:href="@{/}" class="logo">
                RUSHBALL<span>.cup</span>
            </a>

            <a th:href="@{/login}" class="voltar">
                ← Voltar ao login
            </a>

        </div>

    </nav>


    <!-- CADASTRO -->

    <section class="cadastro-section">

        <div class="container">

            <div class="cadastro-container">

                <div class="row g-0">

                    <!-- FORMULÁRIO -->

                    <div class="col-lg-6">

                        <div class="cadastro-form">

                            <div class="tag">
                                ● FAÇA PARTE DA TORCIDA
                            </div>

                            <h1>
                                CRIE SUA <span>CONTA</span>
                            </h1>

                            <p class="descricao">
                                Cadastre-se e acompanhe tudo sobre a Copa!
                            </p>


                            <form th:action="@{/usuarios/cadastrar}"
                                  th:object="${usuarioCadastroDto}"
                                  method="POST">



                                <!-- NOME -->

                                <div class="mb-3">

                                    <label class="form-label">
                                        Nome completo
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{nomeUsuario}"
                                        placeholder="Digite seu nome completo"
                                        maxlength="100"
                                        required
                                    >

                                    <small class="erro-campo"
                                           th:if="${#fields.hasErrors('nomeUsuario')}"
                                           th:errors="*{nomeUsuario}">
                                    </small>

                                </div>


                                <!-- EMAIL -->

                                <div class="mb-3">

                                    <label class="form-label">
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        th:field="*{emailUsuario}"
                                        placeholder="Digite seu e-mail"
                                        required
                                    >

                                    <small class="erro-campo"
                                           th:if="${#fields.hasErrors('emailUsuario')}"
                                           th:errors="*{emailUsuario}">
                                    </small>

                                </div>


                                <!-- SENHA -->

                                <div class="mb-3">

                                    <label class="form-label">
                                        Senha
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        th:field="*{senhaUsuario}"
                                        placeholder="Crie uma senha"
                                        minlength="8"
                                        maxlength="72"
                                        required
                                    >

                                    <small class="erro-campo"
                                           th:if="${#fields.hasErrors('senhaUsuario')}"
                                           th:errors="*{senhaUsuario}">
                                    </small>

                                </div>


                                <!-- CONFIRMAR SENHA -->

                                <div class="mb-3">

                                    <label class="form-label">
                                        Confirmar senha
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        th:field="*{confirmacaoSenha}"
                                        placeholder="Digite sua senha novamente"
                                        required
                                    >

                                    <small class="erro-campo"
                                           th:if="${#fields.hasErrors('confirmacaoSenha')}"
                                           th:errors="*{confirmacaoSenha}">
                                    </small>

                                </div>


                                <!-- TERMOS -->

                                <div class="termos">

                                    <label>

                                        <input
                                            type="checkbox"
                                            required
                                        >

                                        Li e aceito os

                                        <a href="termos.html">
                                            termos de uso
                                        </a>

                                        e a política de privacidade.

                                    </label>

                                </div>


                                <!-- BOTÃO -->

                                <button type="submit" class="btn-cadastrar">
                                    CRIAR MINHA CONTA →
                                </button>

                            </form>


                            <!-- LOGIN -->

                            <div class="login">

                                Já possui uma conta?

                                <a th:href="@{/login}">
                                    Faça login
                                </a>

                            </div>

                        </div>

                    </div>


                    <!-- IMAGEM -->

                    <div class="col-lg-6">

                        <div class="cadastro-image">

                            <div class="image-text">

                                <h2>
                                    ENTRE EM CAMPO
                                    <br>
                                    <span>COM A RUSHBALL!</span>
                                </h2>

                                <p>
                                    Crie sua conta, acompanhe os jogos,
                                    receba notícias e fique por dentro
                                    de tudo sobre suas seleções favoritas.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
